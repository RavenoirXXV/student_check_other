<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เช็คการเข้าแถว ขาด ลา มาสาย</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky1:#e8f4fd; --sky2:#f5faff;
    --blue:#8cc8e8; --blue-d:#5aa9d3; --blue-l:#d6ecf8;
    --yellow:#f0e68c; --yellow-d:#d9c94f;
    --lav:#c9b6f2; --lav-d:#9d84d8;
    --peach:#f5b58a; --peach-d:#e09a68;
    --pink:#f7b6c8;
    --rgb:140,200,232; --rgb-d:90,169,211;
    --ink:#4d8bb0; --soft:#9cc4db; --line:#eef6fb; --tint:#f6fbff;
    --face:#6b8ea8; --cheek:#f7b6c8;
    --l-bg:#fffbe0; --e-bg:#f3eeff; --k-bg:#fff1e6; --l-on:#8a7a1c;
    --abs:#e68fa5; --abs-d:#d98aa0;
    --card:rgba(255,255,255,.9);
    --text:#5a9cc0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Noto Sans Thai',sans-serif;
    color:var(--text);
    min-height:100vh;
    background:linear-gradient(180deg,var(--sky1),var(--sky2) 60%,#fff);
    overflow-x:hidden;
  }

  /* ---------- เมฆลอย ---------- */
  .sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .cloud{
    position:absolute;left:-30%;
    width:var(--w);height:calc(var(--w)*.45);
    background:#fff;border-radius:999px;
    filter:drop-shadow(0 8px 14px rgba(var(--rgb),.35));
    animation:float var(--d) linear infinite;
    animation-delay:var(--delay);
  }
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
  .cloud::before{width:55%;height:120%;left:12%;top:-55%}
  .cloud::after{width:42%;height:95%;right:12%;top:-38%}
  .cloud i{position:absolute;top:30%;width:7%;height:14%;background:var(--face);border-radius:50%;z-index:2}
  .cloud i:nth-child(1){left:36%}
  .cloud i:nth-child(2){left:56%}
  .cloud b{position:absolute;top:52%;left:46%;width:8%;height:10%;
    border-bottom:3px solid var(--face);border-radius:0 0 50% 50%;z-index:2}
  .cloud em{position:absolute;top:50%;width:9%;height:9%;background:var(--cheek);
    border-radius:50%;opacity:.7;z-index:2}
  .cloud em:nth-of-type(1){left:26%}
  .cloud em:nth-of-type(2){left:66%}
  @keyframes float{from{transform:translateX(0)}to{transform:translateX(160vw)}}

  /* ---------- เลย์เอาต์ ---------- */
  .wrap{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:20px 16px 60px}

  header{display:flex;gap:14px;align-items:center;justify-content:space-between;margin-bottom:22px}
  .title-card{
    flex:1;background:var(--card);border-radius:28px;padding:18px 24px;
    box-shadow:0 10px 30px rgba(var(--rgb),.35);
  }
  .title-card h1,.title-card p{font-size:clamp(1.05rem,4.2vw,1.7rem);font-weight:700;color:var(--blue)}
  .title-card p{margin-top:6px}

  .clock{
    width:96px;height:96px;flex:none;border-radius:50%;
    background:var(--card);box-shadow:0 10px 30px rgba(var(--rgb),.35);
    position:relative;
  }
  .clock .hand{position:absolute;left:50%;top:50%;transform-origin:bottom center;
    background:var(--blue);border-radius:4px}
  .clock .h{width:4px;height:26px;margin-left:-2px;margin-top:-26px}
  .clock .m{width:3px;height:36px;margin-left:-1.5px;margin-top:-36px}
  .clock .dot{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px;
    background:var(--blue-d);border-radius:50%}

  /* ---------- สรุปด้านบน ---------- */
  .summary{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:18px}
  .sum{background:var(--card);border-radius:20px;padding:12px 4px;text-align:center;
    box-shadow:0 6px 18px rgba(var(--rgb),.25)}
  .sum small{display:block;font-size:.72rem;line-height:1.2;min-height:2.4em}
  .sum strong{font-size:1.6rem}
  .sum.p strong{color:var(--blue-d)}
  .sum.l strong{color:var(--yellow-d)}
  .sum.e strong{color:var(--lav-d)}
  .sum.k strong{color:var(--peach-d)}
  .sum.a strong{color:var(--abs)}

  /* ---------- รายชื่อ ---------- */
  .panel{background:var(--card);border-radius:32px;padding:22px 18px 14px;
    box-shadow:0 10px 30px rgba(var(--rgb),.35);border:1.5px solid var(--blue-l);margin-bottom:22px}
  .panel h2{text-align:center;font-size:1.5rem;color:var(--blue);margin-bottom:10px}

  .head,.row{display:grid;grid-template-columns:28px 1fr repeat(4,56px);align-items:center;gap:4px}
  .head{font-size:.72rem;text-align:center;padding:0 4px 8px;border-bottom:1.5px dashed var(--blue-l);line-height:1.2}
  .head .c-p{color:var(--blue)}
  .head .c-l{color:var(--yellow-d)}
  .head .c-e{color:var(--lav-d)}
  .head .c-k{color:var(--peach-d)}
  .row{padding:7px 4px;border-bottom:1px solid var(--line);font-size:.95rem}
  .row:last-child{border-bottom:none}
  .row .no{color:var(--soft);font-size:.8rem;text-align:center}
  .row .nm{font-weight:500;line-height:1.35}
  .row.is-p .nm{color:var(--blue-d)}
  .row.is-l .nm{color:var(--yellow-d)}
  .row.is-e .nm{color:var(--lav-d)}
  .row.is-k .nm{color:var(--peach-d)}
  .row.is-a .nm{color:var(--abs-d)}

  .tag{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;
    font-size:.68rem;font-weight:500;vertical-align:middle;color:#fff}
  .tag.rd{background:#9bc59b}
  .tag.ath{background:#f2a97b}

  .box{display:flex;justify-content:center}
  .box input{appearance:none;-webkit-appearance:none;width:30px;height:30px;
    border-radius:8px;border:3px solid var(--blue);background:#fff;cursor:pointer;
    transition:.15s;position:relative}
  .box.l input{border-color:var(--yellow)}
  .box.e input{border-color:var(--lav)}
  .box.k input{border-color:var(--peach)}
  .box input:checked{background:var(--blue)}
  .box.l input:checked{background:var(--yellow)}
  .box.e input:checked{background:var(--lav)}
  .box.k input:checked{background:var(--peach)}
  .box input:checked::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;
    color:#fff;font-weight:700;font-size:18px}
  .box input:active{transform:scale(.88)}

  /* ---------- โหมดจัดการรายชื่อ ---------- */
  .mrow{display:grid;grid-template-columns:1fr 104px 38px;gap:6px;padding:6px 0;border-bottom:1px solid var(--line)}
  .mrow input,.mrow select,.addform input,.addform select,.clsbox input{
    font-family:inherit;font-size:.9rem;color:var(--blue-d);
    border:1.5px solid var(--blue-l);border-radius:12px;padding:8px 10px;background:#fff;min-width:0}
  .del{background:#fde4ea;color:#e68fa5;padding:0;border-radius:12px;font-size:1rem}
  .addform{display:grid;grid-template-columns:96px 1fr 104px auto;gap:6px;margin-top:14px;
    padding-top:14px;border-top:1.5px dashed var(--blue-l)}
  .hint{font-size:.78rem;text-align:center;margin-top:10px;color:var(--soft)}

  /* ---------- ปุ่ม ---------- */
  .actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:26px}
  button{font-family:inherit;border:none;border-radius:999px;padding:11px 22px;
    font-size:.95rem;font-weight:500;cursor:pointer;transition:.15s}
  button:active{transform:scale(.96)}
  .btn-main{background:var(--blue);color:#fff}
  .btn-sub{background:#fff;color:var(--blue-d);border:1.5px solid var(--blue-l)}
  .btn-all{background:var(--blue-l);color:var(--blue-d)}
  .btn-lav{background:var(--lav);color:#fff}

  button.chip{display:inline-block;margin:3px 0 0 6px;padding:0 9px;border-radius:999px;
    border:1.5px solid var(--yellow);background:#fff;color:var(--yellow-d);font-size:.68rem;line-height:1.6}
  button.chip.on{background:var(--yellow);color:var(--l-on)}

  /* ---------- สรุป (เลื่อนซ้ายขวา) ---------- */
  .tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
  button.tab{background:#fff;color:var(--blue-d);border:1.5px solid var(--blue-l);padding:8px 16px;font-size:.88rem}
  button.tab.on{background:var(--blue);color:#fff;border-color:var(--blue)}
  .clsbox{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:12px;font-size:.9rem}
  .clsbox input{width:110px;text-align:center}
  .slider{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;scrollbar-width:none}
  .slider::-webkit-scrollbar{display:none}
  .slide{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;padding:0 2px}
  .slide textarea{width:100%;font-family:inherit;font-size:.95rem;line-height:1.7;color:var(--ink);
    background:var(--tint);border:1.5px solid var(--blue-l);border-radius:20px;padding:16px;
    resize:vertical;white-space:pre-wrap}
  .rep-actions{display:flex;justify-content:center;margin-top:12px}
  .swipe{font-size:.76rem;text-align:center;margin-top:10px;color:var(--soft)}

  /* ---------- การ์ดสำหรับแคปหน้าจอ ---------- */
  .snap{background:#fff;border:1.5px solid var(--blue-l);border-radius:24px;padding:18px 16px 14px}
  .snap-h{text-align:center;margin-bottom:12px}
  .snap-h b{display:block;font-size:1.2rem;color:var(--blue-d)}
  .snap-h small{display:block;font-size:.8rem;color:var(--soft);margin-top:2px}
  .snap-n{display:inline-block;margin-top:8px;padding:3px 14px;border-radius:999px;
    background:var(--blue-l);color:var(--blue-d);font-size:.85rem;font-weight:500}
  .snap ol{margin-left:1.6em;line-height:1.9;color:var(--ink);font-size:.95rem}
  .snap-ok{text-align:center;padding:22px 0;color:var(--blue-d)}
  .grp{border-radius:18px;padding:10px 12px 8px;margin-bottom:10px}
  .grp h4{font-size:1rem;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
  .grp h4 span{font-size:.8rem;font-weight:500}
  .grp.y{background:var(--l-bg)}.grp.y h4{color:var(--yellow-d)}
  .grp.v{background:var(--e-bg)}.grp.v h4{color:var(--lav-d)}
  .grp.o{background:var(--k-bg)}.grp.o h4{color:var(--peach-d)}
  .snap em{font-style:normal;font-size:.8rem;color:var(--yellow-d)}
  button.tab{padding:7px 13px}

  /* ---------- ป๊อปอัป / ข้อความเตือน ---------- */
  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);opacity:0;
    background:var(--blue-d);color:#fff;padding:10px 20px;border-radius:999px;
    transition:.3s;z-index:20;font-size:.9rem;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .modal{position:fixed;inset:0;background:rgba(var(--rgb-d),.25);backdrop-filter:blur(3px);
    display:none;align-items:center;justify-content:center;z-index:30;padding:20px}
  .modal.show{display:flex}
  .modal .box2{background:#fff;border-radius:28px;padding:26px 24px 20px;max-width:340px;width:100%;
    text-align:center;box-shadow:0 14px 40px rgba(var(--rgb-d),.4)}
  .modal p{margin-bottom:18px;font-size:1.02rem}
  .modal .btns{display:flex;gap:10px;justify-content:center}

  @media (max-width:480px){
    .wrap{padding:14px 10px 50px}
    .panel{padding:18px 10px 10px}
    .clock{width:72px;height:72px}
    .clock .h{height:19px;margin-top:-19px}
    .clock .m{height:27px;margin-top:-27px}
    .summary{grid-template-columns:repeat(3,1fr)}
    .head,.row{grid-template-columns:20px 1fr repeat(4,37px);gap:2px}
    .head{font-size:.58rem;padding:0 2px 8px}
    .box input{width:26px;height:26px;border-width:2.5px}
    .box input:checked::after{font-size:15px}
    .row{font-size:.86rem;padding:7px 2px}
    button.chip{display:block;margin-left:0}
    .addform{grid-template-columns:1fr 1fr}
    .addform input{grid-column:1 / -1}
    .slide textarea{padding:12px;font-size:.9rem}
  }

  /* ---------- แถบนำทางด้านล่าง + ซูม ---------- */
  .wrap{padding-bottom:110px}
  .dock{position:fixed;left:0;right:0;bottom:10px;z-index:15;display:flex;flex-direction:column;
    align-items:center;gap:6px;pointer-events:none}
  .dock>*{pointer-events:auto}
  .dock .pill{width:min(190px,54vw);height:48px;border-radius:999px;background:rgba(255,255,255,.93);
    backdrop-filter:blur(8px);box-shadow:0 8px 22px rgba(var(--rgb),.45);
    display:flex;justify-content:space-around;align-items:center}
  .dock button.nav{background:none;padding:6px 16px;color:#dfe3e6;border-radius:999px;line-height:0}
  .dock button.nav.on{color:var(--blue-d)}
  .zoom{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.92);border-radius:999px;
    padding:1px 6px;box-shadow:0 4px 12px rgba(var(--rgb),.3);color:var(--blue-d);font-weight:700;font-size:.72rem}
  .zoom button{background:none;color:var(--blue-d);padding:1px 8px;font-size:1rem;line-height:1.2}
  .zoom span{min-width:38px;text-align:center}
  .toast{bottom:110px}

  /* ---------- ธีมสี ---------- */
  /* --blue = สีหลักของธีม | --yellow/--lav/--peach = สีของ ลา/ขอเข้าสาย/ติดภารกิจ (สลับเมื่อซ้ำกับสีธีม) */
  html[data-theme="yellow"]{
    --sky1:#fff6d6;--sky2:#fffbea;
    --blue:#efc94c;--blue-d:#c99a1e;--blue-l:#fbefc2;--text:#b58a1c;
    --rgb:240,200,80;--rgb-d:201,154,30;
    --ink:#9a7420;--soft:#d8bd78;--line:#faf1d4;--tint:#fffbee;--face:#8a6a3a;--cheek:#f7b6a8;
    --yellow:#8cc8e8;--yellow-d:#4f9cc7;--l-bg:#e6f3fb;--l-on:#1f5f86;
    --peach:#9bd3a8;--peach-d:#5faa73;--k-bg:#e8f6ea;
  }
  html[data-theme="pink"]{
    --sky1:#ffeaf1;--sky2:#fff5f8;
    --blue:#f4a8c0;--blue-d:#e0709a;--blue-l:#fbdbe6;--text:#d0668f;
    --rgb:244,168,192;--rgb-d:224,112,154;
    --ink:#b85580;--soft:#e8a9c0;--line:#fdeaf1;--tint:#fff7fa;--face:#8a5c70;--cheek:#f59ab5;
    --peach:#9bd3a8;--peach-d:#5faa73;--k-bg:#e8f6ea;
    --abs:#7fb2d9;--abs-d:#5f9bc9;
  }
  html[data-theme="purple"]{
    --sky1:#f1ebff;--sky2:#f8f5ff;
    --blue:#b9a2ef;--blue-d:#8f72d6;--blue-l:#e6dcfa;--text:#8b6fd0;
    --rgb:185,162,239;--rgb-d:143,114,214;
    --ink:#7a5fbe;--soft:#bba8e0;--line:#f1ecfc;--tint:#faf8ff;--face:#6c5a8c;
    --lav:#8cc8e8;--lav-d:#4f9cc7;--e-bg:#e6f3fb;
  }
  html[data-theme="green"]{
    --sky1:#e8f6ea;--sky2:#f4fbf5;
    --blue:#9bd3a8;--blue-d:#5faa73;--blue-l:#d9efdf;--text:#5a9a6c;
    --rgb:155,211,168;--rgb-d:95,170,115;
    --ink:#4b8a5c;--soft:#9dc7a8;--line:#e9f4ec;--tint:#f5fbf6;--face:#5f7f68;
  }
  .dock .pill{position:relative;width:min(230px,64vw)}
  .dock button.tbtn{background:none;padding:6px 16px;color:var(--blue);border-radius:999px;line-height:0}
  .dock button.tbtn.open{color:var(--blue-d)}
  .themepop{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);
    display:flex;gap:8px;padding:8px 10px;border-radius:999px;background:rgba(255,255,255,.96);
    box-shadow:0 8px 22px rgba(var(--rgb),.45)}
  .themepop[hidden]{display:none}
  .themepop button{background:#fff;border:2px solid var(--blue-l);padding:0;width:38px;height:38px;
    border-radius:50%;line-height:0;display:grid;place-items:center}
  .themepop button.on{border-color:var(--blue-d);box-shadow:0 0 0 3px var(--blue-l)}
  .themepop svg{width:20px;height:20px}

  /* ของลอยตามธีม: ซากุระ / ใบไม้ (ร่วง) · กระดูก / ดอกไม้ (ลอยผ่าน) */
  .fl{position:absolute;color:var(--blue);will-change:transform}
  .fl svg{display:block;width:var(--s);height:auto}
  .fl.fall{top:0;animation:fall var(--d) linear infinite;animation-delay:var(--delay)}
  .fl.tumble{left:-30%;animation:tumble var(--d) linear infinite;animation-delay:var(--delay)}
  @keyframes fall{
    0%{transform:translate(0,-12vh) rotate(0deg)}
    50%{transform:translate(45px,50vh) rotate(200deg)}
    100%{transform:translate(-25px,112vh) rotate(400deg)}
  }
  @keyframes tumble{from{transform:translateX(0) rotate(0deg)}to{transform:translateX(160vw) rotate(360deg)}}
</style>
</head>
<body>

<div class="sky" id="sky"></div>

<div class="wrap">
  <header>
    <div class="title-card">
      <h1>เช็คการเข้าแถว ขาด ลา มาสาย</h1>
      <p id="dateText"></p>
    </div>
    <div class="clock" aria-hidden="true">
      <div class="hand h" id="hH"></div>
      <div class="hand m" id="hM"></div>
      <div class="dot"></div>
    </div>
  </header>

  <div id="pgHome">
  <div class="summary">
    <div class="sum p"><small>ทันแถว/<br>มา รร.</small><strong id="cP">0</strong></div>
    <div class="sum l"><small>ลา</small><strong id="cL">0</strong></div>
    <div class="sum e"><small>ขออนุญาต<br>เข้าสาย</small><strong id="cE">0</strong></div>
    <div class="sum k"><small>ติดภารกิจ<br>รด./กีฬา</small><strong id="cK">0</strong></div>
    <div class="sum a"><small>ขาด/<br>มาสาย</small><strong id="cA">0</strong></div>
  </div>

  <section class="panel">
    <h2 id="panelTitle">รายชื่อนักเรียน</h2>
    <div id="head" class="head">
      <span></span><span></span>
      <span class="c-p">ทันแถว/<br>มา รร.</span>
      <span class="c-l">ลา</span>
      <span class="c-e">ขอเข้า<br>สาย</span>
      <span class="c-k">รด./<br>กีฬา</span>
    </div>
    <div id="list"></div>
    <form class="addform" id="addForm" style="display:none">
      <select id="addPrefix">
        <option>นาย</option><option>นางสาว</option><option>เด็กชาย</option><option>เด็กหญิง</option>
      </select>
      <input id="addName" placeholder="ชื่อ นามสกุล" autocomplete="off">
      <select id="addTag">
        <option value="">ปกติ</option><option value="rd">รด.</option><option value="ath">นักกีฬา</option>
      </select>
      <button type="submit" class="btn-main">+ เพิ่ม</button>
    </form>
    <p class="hint" id="manageHint" style="display:none">แก้ชื่อ / เปลี่ยนกลุ่ม / ลบ ได้เลย (เซฟอัตโนมัติ) แล้วกด "เสร็จสิ้น"</p>
  </section>

  <div class="actions">
    <button class="btn-all" id="allBtn">✓ มาครบทุกคน</button>
    <button class="btn-lav" id="manageBtn">✎ จัดการรายชื่อ</button>
    <button class="btn-sub" id="resetBtn">ล้างช่องที่ติ๊ก</button>
  </div>
  </div>

  <div id="pgReport" hidden>
  <section class="panel">
    <h2>สรุปรายงาน</h2>
    <div class="tabs">
      <button class="tab on" data-i="0">สรุปการเข้าแถว</button>
      <button class="tab" data-i="1">สรุปการเข้าเรียน</button>
      <button class="tab" data-i="2">ยังไม่ได้เช็ค</button>
      <button class="tab" data-i="3">เช็คแล้ว</button>
    </div>
    <div class="clsbox">ห้อง <input id="cls" placeholder="เช่น ม.4/2" autocomplete="off"></div>

    <div class="slider" id="slider">
      <div class="slide">
        <textarea id="rpAssembly" readonly rows="16"></textarea>
        <div class="rep-actions"><button class="btn-main" data-copy="rpAssembly">คัดลอกสรุปการเข้าแถว</button></div>
      </div>
      <div class="slide">
        <textarea id="rpClass" readonly rows="16"></textarea>
        <div class="rep-actions"><button class="btn-main" data-copy="rpClass">คัดลอกสรุปการเข้าเรียน</button></div>

<script>
/* tag: rd = รด., ath = นักกีฬา */
const TAG_NAME = {rd:"รด.", ath:"นักกีฬา"};

/* ====== localStorage แบบปลอดภัย ====== */
const store = {
  get(k,def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};

/* ====== ของลอยตามธีม: เมฆ / กระดูก / ซากุระ / ดอกไม้ / ใบไม้ ====== */
const sky = document.getElementById('sky');
const petals = (n, tpl) => Array.from({length:n},(_,i)=>tpl.replace('ROT', i*360/n)).join('');
const SHAPES = {
  cloud:  '<svg viewBox="0 0 32 32"><path fill="currentColor" d="M9 25a6 6 0 0 1-.6-12 8.5 8.5 0 0 1 16.4 1.8A5.2 5.2 0 0 1 24 25z"/></svg>',
  bone:   '<svg viewBox="0 0 40 32"><g fill="currentColor"><rect x="9" y="12" width="22" height="8" rx="4"/><circle cx="9" cy="11" r="5"/><circle cx="9" cy="21" r="5"/><circle cx="31" cy="11" r="5"/><circle cx="31" cy="21" r="5"/></g></svg>',
  sakura: `<svg viewBox="0 0 32 32"><g fill="currentColor">${petals(5,'<ellipse cx="16" cy="8.5" rx="5" ry="7.5" transform="rotate(ROT 16 16)"/>')}</g><circle cx="16" cy="16" r="2.4" fill="#fff" opacity=".75"/></svg>`,
  flower: `<svg viewBox="0 0 32 32"><g fill="currentColor">${petals(6,'<circle cx="16" cy="8" r="5.2" transform="rotate(ROT 16 16)"/>')}</g><circle cx="16" cy="16" r="3.2" fill="#fff" opacity=".8"/></svg>`,
  leaf:   '<svg viewBox="0 0 32 32"><path fill="currentColor" d="M16 3C27 8 29 21 16 29 3 21 5 8 16 3z"/><path d="M16 9v17" stroke="#fff" stroke-width="1.6" stroke-linecap="round" fill="none" opacity=".7"/></svg>'
};
/* ชื่อรูปทรง, สีไอคอนในปุ่มเลือก, ชื่อธีม */
const THEME_META = {
  blue:   ['cloud',  '#8cc8e8', 'ธีมก้อนเมฆ'],
  yellow: ['bone',   '#efc94c', 'ธีมกระดูก'],
  pink:   ['sakura', '#f4a8c0', 'ธีมซากุระ'],
  purple: ['flower', '#b9a2ef', 'ธีมดอกไม้'],
  green:  ['leaf',   '#9bd3a8', 'ธีมใบไม้']
};
/* จำนวน / ขนาด / แบบการเคลื่อนไหวของของลอย */
const FLOAT = {
  yellow: {n:8,  size:[30,48], mode:'tumble'},
  pink:   {n:16, size:[14,26], mode:'fall'},
  purple: {n:11, size:[18,32], mode:'tumble'},
  green:  {n:12, size:[18,30], mode:'fall'}
};
let theme = store.get('theme-v1','blue');
if(!THEME_META[theme]) theme='blue';

function buildSky(){
  sky.innerHTML='';
  if(theme==='blue'){                                  // ก้อนเมฆหน้าตาน่ารัก
    for(let i=0;i<8;i++){
      const c = document.createElement('div');
      c.className='cloud';
      c.style.setProperty('--w', (90 + Math.random()*110)+'px');
      c.style.top = (3 + Math.random()*88)+'%';
      c.style.setProperty('--d', (45 + Math.random()*50)+'s');
      c.style.setProperty('--delay', (-Math.random()*90)+'s');
      c.style.opacity = .55 + Math.random()*.4;
      c.innerHTML = '<i></i><i></i><b></b><em></em><em></em>';
      sky.appendChild(c);
    }
    return;
  }
  const cfg = FLOAT[theme], shape = SHAPES[THEME_META[theme][0]];
  for(let i=0;i<cfg.n;i++){
    const c = document.createElement('div');
    c.className = 'fl ' + cfg.mode;
    c.innerHTML = shape;
    c.style.setProperty('--s', (cfg.size[0] + Math.random()*(cfg.size[1]-cfg.size[0]))+'px');
    c.style.setProperty('--d', (cfg.mode==='fall' ? 14+Math.random()*14 : 50+Math.random()*40)+'s');
    c.style.setProperty('--delay', (-Math.random()*60)+'s');
    if(cfg.mode==='fall') c.style.left = (Math.random()*100)+'%';
    else c.style.top = (3 + Math.random()*88)+'%';
    c.style.opacity = .5 + Math.random()*.4;
    c.style.color = Math.random()<.35 ? 'var(--blue-d)' : 'var(--blue)';
    sky.appendChild(c);
  }
}
function applyTheme(){
  document.documentElement.setAttribute('data-theme', theme);
  document.querySelectorAll('[data-pick]').forEach(b=>b.classList.toggle('on', b.dataset.pick===theme));
  store.set('theme-v1', theme);
  buildSky();
}

/* ====== วันที่ + นาฬิกา ====== */
const months=["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const monthsShort=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const weekdays=["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"];
const now = new Date();
const beYear = now.getFullYear()+543;
document.getElementById('dateText').textContent = `${now.getDate()} ${months[now.getMonth()]} ${beYear}`;
function tick(){
  const d=new Date(), m=d.getMinutes(), h=d.getHours()%12;
  document.getElementById('hM').style.transform=`rotate(${m*6}deg)`;
  document.getElementById('hH').style.transform=`rotate(${h*30+m*.5}deg)`;
}
tick(); setInterval(tick,15000);

/* ====== ข้อมูล ====== */
const pad = n => String(n).padStart(2,'0');
const dayKey = 'attendance-' + now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());

let students = store.get('students-v1', []);
/* data[id] = 'p' ทันแถว | 'l' ลา | 'e' ขออนุญาตเข้าสาย | 'k' ติดภารกิจ(รด./นักกีฬา)
   data['h'+id] = 1  → ลาเฉพาะช่วงเช้า */
let data = store.get(dayKey, {});
const saveStudents = () => store.set('students-v1', students);
const saveData = () => store.set(dayKey, data);

const clsInput = document.getElementById('cls');
clsInput.value = store.get('class-label','');
clsInput.addEventListener('input',()=>{ store.set('class-label',clsInput.value); buildReports(); });

let manage = students.length===0;

/* ====== ช่วยเหลือเรื่องชื่อ ====== */
const PREFIX_RE = /^(นางสาว|นาง|นาย|เด็กชาย|เด็กหญิง)(.*)$/;
function splitName(n){ const m=n.trim().match(PREFIX_RE); return m?[m[1],m[2].trim()]:['',n.trim()]; }
function fmtName(n){ const [p,r]=splitName(n); return p?`${p} ${r}`:r; }
function isMale(n){ const p=splitName(n)[0]; return p==='นาย'||p==='เด็กชาย'; }
const esc = s => s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ====== วาดรายชื่อ ====== */
const list = document.getElementById('list');

function render(){
  document.getElementById('head').style.display = manage?'none':'grid';
  document.getElementById('addForm').style.display = manage?'grid':'none';
  document.getElementById('manageHint').style.display = manage?'block':'none';
  document.getElementById('panelTitle').textContent = manage?'จัดการรายชื่อ':'รายชื่อนักเรียน';
  document.getElementById('manageBtn').textContent = manage?'✓ เสร็จสิ้น':'✎ จัดการรายชื่อ';

  if(manage){
    if(!students.length){
      list.innerHTML='<p class="hint" style="font-size:.9rem;padding:14px 0">ยังไม่มีรายชื่อ ☁️<br>เพิ่มชื่อนักเรียนด้านล่างได้เลย แล้วกด "เสร็จสิ้น"</p>';
    }else
    list.innerHTML = students.map(s=>`
      <div class="mrow">
        <input class="mname" data-id="${s.id}" value="${esc(s.name)}">
        <select class="mtag" data-id="${s.id}">
          <option value="" ${s.tag===''?'selected':''}>ปกติ</option>
          <option value="rd" ${s.tag==='rd'?'selected':''}>รด.</option>
          <option value="ath" ${s.tag==='ath'?'selected':''}>นักกีฬา</option>
        </select>
        <button type="button" class="del" data-id="${s.id}" aria-label="ลบ">✕</button>
      </div>`).join('');
  }else{
    list.innerHTML = students.map((s,i)=>{
      const st = data[s.id];
      const cls = st==='p'?'is-p':st==='l'?'is-l':st==='e'?'is-e':st==='k'?'is-k':'is-a';
      const tag = s.tag?`<span class="tag ${s.tag}">${TAG_NAME[s.tag]}</span>`:'';
      const chip = st==='l'
        ? `<button type="button" class="chip ${data['h'+s.id]?'on':''}" data-half="${s.id}">${data['h'+s.id]?'✓ ':''}เฉพาะช่วงเช้า</button>` : '';
      const kBox = s.tag
        ? `<label class="box k"><input type="checkbox" data-id="${s.id}" data-t="k" ${st==='k'?'checked':''}></label>`
        : `<span></span>`;
      return `<div class="row ${cls}">
        <span class="no">${i+1}</span>
        <span class="nm">${esc(s.name)}${tag}${chip}</span>
        <label class="box"><input type="checkbox" data-id="${s.id}" data-t="p" ${st==='p'?'checked':''}></label>
        <label class="box l"><input type="checkbox" data-id="${s.id}" data-t="l" ${st==='l'?'checked':''}></label>
        <label class="box e"><input type="checkbox" data-id="${s.id}" data-t="e" ${st==='e'?'checked':''}></label>
        ${kBox}
      </div>`;
    }).join('');
  }

  const c={p:0,l:0,e:0,k:0};
  students.forEach(s=>{ const st=data[s.id]; if(c[st]!==undefined) c[st]++; });
  document.getElementById('cP').textContent=c.p;
  document.getElementById('cL').textContent=c.l;
  document.getElementById('cE').textContent=c.e;
  document.getElementById('cK').textContent=c.k;
  document.getElementById('cA').textContent=students.length-c.p-c.l-c.e-c.k;
  buildReports();
}

/* ====== รายงานสรุป ====== */
function setReport(id, txt){
  const ta=document.getElementById(id);
  ta.value=txt;
  ta.rows=Math.min(40, txt.split('\n').length+1);
}

function buildReports(){
  const cls = clsInput.value.trim();
  const yy  = String(beYear).slice(-2);
  const dateLine = `วัน ${weekdays[now.getDay()]} ที่ ${now.getDate()} ${monthsShort[now.getMonth()]} ${beYear}`;
  const withTag = s => `${s.name} (${TAG_NAME[s.tag]})`;
  const withHalf = s => data['h'+s.id] ? `${s.name} (เฉพาะช่วงเช้า)` : s.name;

  const present = students.filter(s=>data[s.id]==='p');
  const leave   = students.filter(s=>data[s.id]==='l');
  const late    = students.filter(s=>data[s.id]==='e');
  const busy    = students.filter(s=>data[s.id]==='k');
  const none    = students.filter(s=>!data[s.id]);

  /* ---- 1) สรุปการเข้าแถว ---- */
  const a = [
    `รายงานการเข้าแถว${cls}`,
    dateLine,
    `นักเรียนมีจำนวน ${students.length} คน`,
    `มาเข้าแถว ${present.length} คน`
  ];
  const lateAll = students.filter(s=>!data[s.id]);   // สาย = ยังไม่ติ๊กอะไรเลย
  if(lateAll.length){ a.push('', '•สาย'); lateAll.forEach(s=>a.push(s.name)); }
  if(late.length){ a.push('', '•ขออนุญาตเข้าสาย'); late.forEach(s=>a.push(s.name)); }
  if(leave.length){ a.push('', '•ลา'); leave.forEach(s=>a.push(withHalf(s))); }
  if(busy.length){ a.push('', '•ติดภารกิจ'); busy.forEach(s=>a.push(withTag(s))); }
  setReport('rpAssembly', a.join('\n'));

  /* ---- 2) สรุปการเข้าเรียน (แยกชาย/หญิง) ---- */
  const section = (title, group)=>{
    const lv = group.filter(s=>data[s.id]==='l');
    const bz = group.filter(s=>data[s.id]==='k');
    const ab = group.filter(s=>!data[s.id]);
    const came = group.length - lv.length - ab.length - bz.length;   // ขอเข้าสายนับว่ามาเรียน
    const out = [`• ${title}มีทั้งหมด ${group.length} คน`, `มาเรียน ${came} คน`];
    if(lv.length){ out.push(`ลา ${lv.length} คน`); lv.forEach((s,i)=>out.push(`${i+1}.${fmtName(s.name)}`)); }
    if(ab.length){ out.push(`ขาด ${ab.length} คน`); ab.forEach((s,i)=>out.push(`${i+1}.${fmtName(s.name)}`)); }
    if(bz.length){ out.push(`ติดภารกิจ ${bz.length} คน`); bz.forEach((s,i)=>out.push(`${i+1}.${fmtName(s.name)} (${TAG_NAME[s.tag]})`)); }
    return {text:out.join('\n'), came};
  };
  const males   = students.filter(s=>isMale(s.name));
  const females = students.filter(s=>!isMale(s.name));
  const parts=[]; let total=0;
  if(males.length){ const r=section('นักเรียนชาย',males); parts.push(r.text); total+=r.came; }
  if(females.length){ const r=section('นักเรียนหญิง',females); parts.push(r.text); total+=r.came; }
  setReport('rpClass',
`รายงานสถิติ ขาดลา ${cls} ปี${yy}
นักเรียนมีทั้งหมด ${students.length} คน

${parts.join('\n\n')}

รวมมาเรียนทั้งหมด ${total} คน`);

  buildSnaps(cls, dateLine);
}

/* ---- หน้า "ยังไม่ได้เช็ค" และ "เช็คแล้ว" (ไว้แคปหน้าจอส่งเพื่อน) ---- */
function buildSnaps(cls, dateLine){
  const head = (icon,title,extra)=>
    `<div class="snap-h"><b>${icon} ${title}</b><small>${dateLine}${cls?' · '+esc(cls):''}</small>${extra||''}</div>`;
  const names = (arr,fn)=>`<ol>${arr.map(s=>`<li>${fn?fn(s):esc(s.name)}</li>`).join('')}</ol>`;

  // ยังไม่ได้เช็ค
  const un = students.filter(s=>!data[s.id]);
  document.getElementById('pgUnchecked').innerHTML =
    `<div class="snap">${head('⏳','ยังไม่ได้เช็ค', un.length?`<span class="snap-n">เหลือ ${un.length} คน</span>`:'')}
     ${un.length?names(un):'<p class="snap-ok">เช็คครบทุกคนแล้ว 🎉</p>'}</div>`;

  // เช็คแล้ว: ลา / ขออนุญาตเข้าสาย / ติดภารกิจ
  const groups=[['ลา','l','y'],['ขออนุญาตเข้าสาย','e','v'],['ติดภารกิจ (รด./นักกีฬา)','k','o']];
  let html='';
  groups.forEach(([title,k,c])=>{
    const arr=students.filter(s=>data[s.id]===k);
    if(!arr.length) return;
    html+=`<div class="grp ${c}"><h4>${title}<span>${arr.length} คน</span></h4>${
      names(arr,s=>esc(s.name)
        +(k==='k'&&s.tag?` <span class="tag ${s.tag}">${TAG_NAME[s.tag]}</span>`:'')
        +(k==='l'&&data['h'+s.id]?' <em>(เฉพาะช่วงเช้า)</em>':''))
    }</div>`;
  });
  document.getElementById('pgChecked').innerHTML =
    `<div class="snap">${head('✅','เช็คแล้ว')}${html||'<p class="snap-ok">ยังไม่มีใครลา / ขอเข้าสาย / ติดภารกิจ</p>'}</div>`;
}

/* ====== สไลด์เลื่อนซ้าย-ขวา ====== */
const slider=document.getElementById('slider');
const tabs=[...document.querySelectorAll('.tab')];
tabs.forEach(t=>t.addEventListener('click',()=>{
  slider.scrollTo({left:Number(t.dataset.i)*slider.clientWidth, behavior:'smooth'});
  setTab(Number(t.dataset.i));
}));
function setTab(i){ tabs.forEach((t,j)=>t.classList.toggle('on',i===j)); }
slider.addEventListener('scroll',()=>{
  setTab(Math.round(slider.scrollLeft/Math.max(1,slider.clientWidth)));
});

/* ====== ป๊อปอัปยืนยัน / toast ====== */
const toast=document.getElementById('toast');
let toastTimer;
function say(t){
  toast.textContent=t; toast.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>toast.classList.remove('show'),2200);
}
const modal=document.getElementById('modal');
let onYes=null;
function ask(msg, cb){
  document.getElementById('modalMsg').textContent=msg;
  onYes=cb; modal.classList.add('show');
}
document.getElementById('mYes').onclick=()=>{ modal.classList.remove('show'); if(onYes)onYes(); onYes=null; };
document.getElementById('mNo').onclick=()=>{ modal.classList.remove('show'); onYes=null; };

/* ====== เหตุการณ์ในรายชื่อ ====== */
list.addEventListener('change',e=>{
  const el=e.target;
  const id=Number(el.dataset.id);
  if(el.dataset.t){                         // ติ๊กเช็คชื่อ
    if(el.checked) data[id]=el.dataset.t; else delete data[id];
    if(data[id]!=='l') delete data['h'+id];
    saveData(); render();
  }else if(el.classList.contains('mname')){ // แก้ชื่อ
    const s=students.find(x=>x.id===id);
    const v=el.value.trim();
    if(s && v){ s.name=v; saveStudents(); buildReports(); } else if(s){ el.value=s.name; }
  }else if(el.classList.contains('mtag')){  // เปลี่ยนกลุ่ม
    const s=students.find(x=>x.id===id);
    if(s){ s.tag=el.value; if(!s.tag && data[id]==='k'){ delete data[id]; saveData(); } saveStudents(); buildReports(); }
  }
});
list.addEventListener('click',e=>{
  const h=e.target.closest('[data-half]');
  if(h){                                    // ลาเฉพาะช่วงเช้า
    const k='h'+h.dataset.half;
    if(data[k]) delete data[k]; else data[k]=1;
    saveData(); render(); return;
  }
  const b=e.target.closest('.del'); if(!b) return;
  const id=Number(b.dataset.id);
  const s=students.find(x=>x.id===id); if(!s) return;
  ask(`ลบ "${s.name}" ออกจากรายชื่อ?`, ()=>{
    students=students.filter(x=>x.id!==id);
    delete data[id]; delete data['h'+id]; saveStudents(); saveData(); render(); say('ลบแล้ว');
  });
});

/* ====== เพิ่มชื่อ ====== */
document.getElementById('addForm').addEventListener('submit',e=>{
  e.preventDefault();
  const nameEl=document.getElementById('addName');
  const v=nameEl.value.trim();
  if(!v){ say('กรอกชื่อ-นามสกุลก่อนนะ'); return; }
  const id = students.reduce((m,s)=>Math.max(m,s.id),0)+1;
  students.push({id, name: document.getElementById('addPrefix').value + v,
                 tag: document.getElementById('addTag').value});
  saveStudents(); nameEl.value=''; render(); say('เพิ่มรายชื่อแล้ว ☁️');
});

/* ====== ปุ่ม ====== */
document.getElementById('manageBtn').onclick=()=>{ manage=!manage; render(); };
document.getElementById('allBtn').onclick=()=>{
  students.forEach(s=>{ if(!data[s.id]) data[s.id]='p'; });   // คนที่ติ๊กลา/ขอเข้าสาย/ติดภารกิจไว้แล้วจะไม่ถูกทับ
  saveData(); render(); say('ติ๊กมาครบแล้ว (ยกเว้นคนที่ติ๊กอย่างอื่นไว้) ☁️');
};
document.getElementById('resetBtn').onclick=()=>{
  ask('ล้างช่องที่ติ๊กทั้งหมดของวันนี้?', ()=>{
    data={}; saveData(); render(); say('ล้างข้อมูลแล้ว');
  });
};

async function copyText(taId){
  const ta=document.getElementById(taId), t=ta.value;
  try{ if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(t); return true; } }catch(e){}
  try{
    ta.focus(); ta.select(); ta.setSelectionRange(0,t.length);
    const ok=document.execCommand('copy');
    ta.blur(); window.getSelection().removeAllRanges();
    return ok;
  }catch(e){ return false; }
}
document.querySelectorAll('[data-copy]').forEach(b=>{
  b.onclick=async()=>{
    const ok=await copyText(b.dataset.copy);
    say(ok?'คัดลอกสรุปแล้ว ✓':'คัดลอกไม่ได้ กดค้างที่กล่องข้อความแล้วเลือกคัดลอกได้เลย');
  };
});

/* ====== แถบนำทางด้านล่าง (หน้าเช็คชื่อ / หน้าสรุป) ====== */
const pgHome=document.getElementById('pgHome'), pgReport=document.getElementById('pgReport');
document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>{
  const toReport=b.dataset.go==='report';
  pgHome.hidden=toReport; pgReport.hidden=!toReport;
  document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n===b));
  window.scrollTo({top:0});
}));

/* ====== ซูมหน้าเว็บ ====== */
let zoom = Number(store.get('zoom-v1',100)) || 100;
function applyZoom(){
  document.querySelector('.wrap').style.zoom = zoom/100;
  document.getElementById('zVal').textContent = zoom+'%';
  store.set('zoom-v1',zoom);
}
document.getElementById('zIn').onclick=()=>{ zoom=Math.min(150,zoom+10); applyZoom(); };
document.getElementById('zOut').onclick=()=>{ zoom=Math.max(60,zoom-10); applyZoom(); };
applyZoom();

/* ====== ปุ่มเลือกธีมในแถบด้านล่าง ====== */
const themePop=document.getElementById('themePop'), themeBtn=document.getElementById('themeBtn');
themePop.innerHTML = Object.entries(THEME_META).map(([k,m])=>
  `<button type="button" data-pick="${k}" aria-label="${m[2]}" style="color:${m[1]}">${SHAPES[m[0]]}</button>`).join('');
themeBtn.addEventListener('click',e=>{
  e.stopPropagation();
  themePop.hidden=!themePop.hidden; themeBtn.classList.toggle('open',!themePop.hidden);
});
document.addEventListener('click',e=>{
  if(!themePop.hidden && !themePop.contains(e.target)){ themePop.hidden=true; themeBtn.classList.remove('open'); }
});
themePop.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>{
  theme=b.dataset.pick; applyTheme(); themePop.hidden=true; themeBtn.classList.remove('open');
}));
applyTheme();

render();
</script>
</body>
